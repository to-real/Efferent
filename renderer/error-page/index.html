<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>引擎启动失败</title>
  <style>
    :root { --danger: #c53030; --accent: #4d6bfe; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh;
      background: #fafafa; color: #1a1a1a;
    }
    main { width: 520px; text-align: center; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    #diag {
      font-family: Consolas, monospace; font-size: 12px; text-align: left;
      background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px;
      padding: 12px; white-space: pre-wrap; word-break: break-all;
      max-height: 220px; overflow: auto; margin-bottom: 20px;
    }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 10px 28px; font-size: 14px; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main>
    <h1>引擎未能启动</h1>
    <div id="diag">正在获取诊断信息…</div>
    <button id="restart">重新启动引擎</button>
  </main>
  <script>
    const diag = document.getElementById('diag')
    const restart = document.getElementById('restart')
    window.dshDesktop.engineError.onInfo((msg) => { diag.textContent = msg })
    restart.addEventListener('click', () => {
      restart.disabled = true
      restart.textContent = '重启中…'
      window.dshDesktop.engineError.restart().catch(() => {})
    })
  </script>
</body>
</html>
