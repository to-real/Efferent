name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（假依赖）
        run: npm run test:unit

      - name: 构建
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc 编译主进程/preload）
        run: npm run build

      - name: staging（Node 24 运行时 + DSH 引擎）
        run: npm run stage

      - name: 打包 NSIS + 发布到 GitHub Releases
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并发布竞态产生的重复 Release
        run: node scripts/consolidate-release.mjs "$env:GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包产物冒烟（发布门禁）
        run: npx playwright install --with-deps chromium || true && npx playwright test tests/e2e --config playwright.config.ts
